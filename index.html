  <style>
    /* ==========================================================================
       DESIGN TOKENS & MACOS 27 LIQUID GLASS FINDER SYSTEM (DARK MODE)
       ========================================================================== */
    :root {
      --bg-canvas: #000000;
      --window-bg: #1E1E20;
      --column-bg: #1B1B1D;
      --inspector-bg: #171719;
      --glass-pill-bg: rgba(255, 255, 255, 0.055);
      --glass-pill-hover: rgba(255, 255, 255, 0.095);
      --glass-pill-border: rgba(255, 255, 255, 0.11);
      --hairline: rgba(255, 255, 255, 0.085);
      --hairline-strong: rgba(255, 255, 255, 0.15);
      --accent-blue: #0A60FF;
      --accent-blue-text: #4DA3FF;
      --text-primary: #F2F2F7;
      --text-secondary: #98989F;
      --text-tertiary: #636369;
      --traffic-close: #FF5F56;
      --traffic-min: #FFBD2E;
      --traffic-max: #27C93F;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", sans-serif;
      color: var(--text-primary);
      user-select: none;
    }

    .font-mono-tech {
      font-family: "JetBrains Mono", "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       PITCH-BLACK VIEWPORT & MACOS 27 LIQUID GLASS FINDER WINDOW
       ========================================================================== */
    #desktop-viewport {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      overflow: hidden;
    }

    #window-finder {
      position: relative;
      width: min(1140px, 92vw);
      height: min(690px, 88vh);
      background: linear-gradient(180deg, #222225 0%, #1B1B1D 100%);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      box-shadow:
        0 36px 100px rgba(0, 0, 0, 0.95),
        inset 0 1px 0 rgba(255, 255, 255, 0.16),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.24s cubic-bezier(0.16, 1, 0.3, 1), height 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #window-finder.expanded-window {
      width: min(1440px, 97vw);
      height: 94vh;
    }

    /* Liquid Glass Floating Toolbar Pills */
    .liquid-pill {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.04) 100%);
      border: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .liquid-pill-active {
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.22);
      color: #FFFFFF;
    }

    /* Traffic Lights */
    .traffic-lights {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .traffic-btn {
      width: 12.5px;
      height: 12.5px;
      border-radius: 9999px;
      border: 0.5px solid rgba(0, 0, 0, 0.28);
      box-shadow: inset 0 0.5px 0.5px rgba(255, 255, 255, 0.28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: default;
    }

    .traffic-btn svg {
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .traffic-lights:hover .traffic-btn svg {
      opacity: 1;
    }

    .traffic-close { background-color: var(--traffic-close); }
    .traffic-min   { background-color: var(--traffic-min); }
    .traffic-max   { background-color: var(--traffic-max); }

    /* macOS Miller Column Divider + Bottom Resize Grabber Pill */
    .miller-col {
      position: relative;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .miller-col::after {
      content: "";
      position: absolute;
      right: -3.5px;
      bottom: 6px;
      width: 6px;
      height: 13px;
      border-radius: 9999px;
      background-color: #2B2B2E;
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      background-image: linear-gradient(
        to right,
        transparent 1.5px,
        rgba(255, 255, 255, 0.36) 1.5px,
        rgba(255, 255, 255, 0.36) 2.3px,
        transparent 2.3px,
        transparent 3.4px,
        rgba(255, 255, 255, 0.36) 3.4px,
        rgba(255, 255, 255, 0.36) 4.2px,
        transparent 4.2px
      );
      pointer-events: none;
      z-index: 5;
    }

    /* ==========================================================================
       CUSTOM MACOS DARK SCROLLBARS
       ========================================================================== */
    .mac-scroll::-webkit-scrollbar {
      width: 7px;
      height: 8px;
    }
    .mac-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.18);
      border-radius: 9999px;
    }
    .mac-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.32);
      border-radius: 9999px;
      border: 1.5px solid transparent;
      background-clip: content-box;
    }
    .mac-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
      border: 1.5px solid transparent;
      background-clip: content-box;
    }

    /* Selectable text inside Engineering Logs & Specs */
    .selectable-text {
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>

  <div id="desktop-viewport">

      function hashString(str) {
        let h = 2166136261;
        for (let i = 0; i < str.length; i++) {
          h ^= str.charCodeAt(i);
          h = Math.imul(h, 16777619);
        }
        return Math.abs(h);
      }

      function inferDateFromPath(relPath, domain) {
        const isoMatch = relPath.match(/(202[2-5])[_-](0[1-9]|1[0-2])[_-](0[1-9]|[12]\d|3[01])/);
        if (isoMatch) return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;

        const euMatch = relPath.match(/(0[1-9]|[12]\d|3[01])[_.-](0[1-9]|1[0-2])[_.-](202[2-5])/);
        if (euMatch) return `${euMatch[3]}-${euMatch[2]}-${euMatch[1]}`;

        const shortEuMatch = relPath.match(/(0[1-9]|[12]\d|3[01])[_.-](0[1-9]|1[0-2])[_.-](2[2-5])(?=\D|$)/);
        if (shortEuMatch) return `20${shortEuMatch[3]}-${shortEuMatch[2]}-${shortEuMatch[1]}`;

        const domainBase = {
          "Bench": [2023, 6],
          "Chair": [2023, 10],
          "Coffee table": [2023, 11],
          "Launch booth": [2024, 7],
          "Meetings": [2023, 4],
          "Merch": [2023, 8],
          "Multitool": [2024, 8],
          "Tag": [2023, 9],
          "Workshops": [2024, 3]
        };
        const [yr, mo] = domainBase[domain] || [2023, 7];
        const day = (hashString(relPath) % 27) + 1;
        return `${yr}-${String(mo).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      function inferFileMetadata(relPath, fileName) {
        const parts = relPath.split("/");
        const domain = parts[0];
        const dotIdx = fileName.lastIndexOf(".");
        const ext = dotIdx > 0 ? fileName.slice(dotIdx + 1).toUpperCase() : "FILE";
        const h = hashString(relPath);
        const modDate = inferDateFromPath(relPath, domain);
        const createdDate = modDate.replace(/-(\d{2})$/, (_, d) => `-${String(Math.max(1, Number(d) - 4)).padStart(2, "0")}`);

        const sizeRanges = {
          BLEND: [4.2, 28.5, "MB"],
          BLEND1: [4.1, 28.0, "MB"],
          SKP: [2.4, 19.8, "MB"],
          SKB: [2.3, 19.2, "MB"],
          DWG: [0.8, 4.6, "MB"],
          DXF: [0.4, 3.2, "MB"],
          AI: [1.5, 14.2, "MB"],
          PSD: [12.0, 68.0, "MB"],
          INDD: [3.2, 16.4, "MB"],
          PDF: [0.9, 8.7, "MB"],
          JPG: [1.1, 5.4, "MB"],
          JPEG: [1.2, 5.8, "MB"],
          PNG: [0.8, 4.9, "MB"],
          GIF: [1.4, 6.2, "MB"],
          MP4: [8.5, 42.0, "MB"],
          OBJ: [1.6, 11.4, "MB"],
          MTL: [4, 28, "KB"],
          STL: [1.8, 9.5, "MB"],
          DAE: [1.4, 8.2, "MB"],
          "3DS": [1.1, 6.4, "MB"],
          OTF: [48, 210, "KB"],
          VP3: [18, 94, "KB"],
          SAF: [14, 76, "KB"],
          BMP: [32, 180, "KB"],
          DOCX: [0.6, 3.4, "MB"],
          TXT: [6, 34, "KB"],
          ZIP: [18.4, 64.0, "MB"],
          BAK: [0.8, 4.4, "MB"],
          ERR: [2, 12, "KB"],
          LOG: [4, 19, "KB"]
        };
        const [minS, maxS, unit] = sizeRanges[ext] || [0.5, 4.0, "MB"];
        const rawVal = minS + ((h % 100) / 100) * (maxS - minS);
        const size = unit === "KB" ? `${Math.round(rawVal)} KB` : `${rawVal.toFixed(1)} MB`;

        const revMatch = fileName.match(/(?:model|drawing|export|slide|setup|tee|logo|still|f)(\d{1,4})/i);
        const iteration = revMatch ? `REV ${revMatch[1].padStart(2, "0")}` : `${ext} ASSET`;

        let schematicType = "meeting_doc";
        let dimensions = "Archive Asset · 1:1 Scale";
        let material = EXT_KIND_MAP[ext] || `${ext} File`;
        let interactiveParam = null;

      function buildArchiveTreeFromPaths(paths) {
        const root = {
          id: "root",
          name: "reSEARCH",
          type: "folder",
          created: "2022-09-15",
          modified: "2025-03-13",
          notes: "Complete reSEARCH R&D directory archive spanning Bench, Chair, Coffee table, Launch booth, Meetings, Merch, Multitool, Tag, and Workshops.",
          children: []
        };

        const folderLookup = { "": root };

        paths.forEach(rawPath => {
          const segments = rawPath.split("/").filter(Boolean);
          let currentPath = "";
          let parentNode = root;

          segments.forEach((segment, idx) => {
            const isLeaf = idx === segments.length - 1;
            const nextPath = currentPath ? `${currentPath}/${segment}` : segment;

            if (!isLeaf) {
              if (!folderLookup[nextPath]) {
                const topDomain = segments[0];
                const folderDate = inferDateFromPath(nextPath, topDomain);
                const newFolder = {
                  id: `dir:${nextPath}`,
                  name: segment,
                  type: "folder",
                  created: folderDate,
                  modified: folderDate,
                  notes: idx === 0
                    ? (DOMAIN_SCOPE_NOTES[segment] || `${segment} R&D archive directory.`)
                    : `Subdirectory inside reSEARCH › ${segments.slice(0, idx + 1).join(" › ")}.`,
                  children: []
                };
                folderLookup[nextPath] = newFolder;
                parentNode.children.push(newFolder);
              }
              parentNode = folderLookup[nextPath];
            } else {
              const meta = inferFileMetadata(nextPath, segment);
              parentNode.children.push({
                id: `file:${nextPath}`,
                name: segment,
                relPath: nextPath,
                type: "file",
                ...meta
              });
            }

            currentPath = nextPath;
          });
        });

        function sortTreeNodes(node) {
          if (node.type === "folder" && Array.isArray(node.children)) {
            node.children.sort((a, b) => {
              if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
              return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
            });
            node.children.forEach(sortTreeNodes);
          }
        }

        sortTreeNodes(root);
        return root;
      }

      const ARCHIVE_TREE = buildArchiveTreeFromPaths(RAW_ARCHIVE_PATHS);

      /* ======================================================================
         3. RECURSIVE TREE INDEXING & APPLICATION STATE
         ====================================================================== */
      const NODE_MAP = {};
      const PARENT_MAP = {};
      const PATH_MAP = {};
      const ALL_FILES = [];

      function indexTree(node, ancestorIds = []) {
        const currentPath = [...ancestorIds, node.id];
        NODE_MAP[node.id] = node;
        PATH_MAP[node.id] = currentPath;
        if (ancestorIds.length > 0) {
          PARENT_MAP[node.id] = ancestorIds[ancestorIds.length - 1];
        }
        if (node.type === "file") {
          ALL_FILES.push(node);
        } else if (Array.isArray(node.children)) {
          node.children.forEach(child => indexTree(child, currentPath));
        }
      }

      indexTree(ARCHIVE_TREE);

      const DEFAULT_SELECTED_ID = NODE_MAP["file:Bench/Models/Blender/bench_model11.blend"]
        ? "file:Bench/Models/Blender/bench_model11.blend"
        : (ALL_FILES[0]?.id || "root");

      const INITIAL_FOLDER_HISTORY = (PATH_MAP[DEFAULT_SELECTED_ID] || ["root"])
        .filter(id => NODE_MAP[id]?.type === "folder");

      const state = {
        selectedNodeId: DEFAULT_SELECTED_ID,
        viewMode: "columns",          // 'columns' | 'list' | 'icons'
        searchQuery: "",
        folderHistory: INITIAL_FOLDER_HISTORY.length ? INITIAL_FOLDER_HISTORY : ["root"],
        folderHistoryIndex: Math.max(0, INITIAL_FOLDER_HISTORY.length - 1),
        qlBlueprintInvert: false,
        interactiveValues: {}
      };

      ALL_FILES.forEach(f => {
        if (f.interactiveParam) {
          state.interactiveValues[f.id] = f.interactiveParam.defaultVal;
        }
      });

      function getSelectedPathIds() {
        return PATH_MAP[state.selectedNodeId] || ["root"];
      }

      function getCurrentFolderNode() {
        const pathIds = getSelectedPathIds();
        for (let i = pathIds.length - 1; i >= 0; i--) {
          const n = NODE_MAP[pathIds[i]];
          if (n && n.type === "folder") return n;
        }
        return ARCHIVE_TREE;
      }

      /* ======================================================================
         4. GITHUB PAGES REAL-ASSET LOADER & ARCHITECTURAL SVG GENERATOR
         ====================================================================== */
      const REPO_ASSET_CACHE = new Map();

      function getRepoFileUrl(relPath) {
        if (!relPath) return "";
        const encoded = relPath.split("/").map(seg => encodeURIComponent(seg)).join("/");
        return `./reSEARCH/${encoded}`;
      }

      function probeRepoFile(relPath, onAvailable) {
        if (!relPath || !window.location.protocol.startsWith("http")) return;
        const url = getRepoFileUrl(relPath);
        if (REPO_ASSET_CACHE.has(url)) {
          if (REPO_ASSET_CACHE.get(url)) onAvailable(url);
          return;
        }
        fetch(url, { method: "HEAD" })
          .then(res => {
            const exists = Boolean(res && res.ok);
            REPO_ASSET_CACHE.set(url, exists);
            if (exists) onAvailable(url);
          })
          .catch(() => {
            REPO_ASSET_CACHE.set(url, false);
          });
      }

      function buildAssetViewportHTML(file, lightPaper = false, slotId = "viewport") {
        const url = getRepoFileUrl(file.relPath);
        const fallbackSVG = generateTechnicalSchematicSVG(file, lightPaper);
        const imageExts = ["JPG", "JPEG", "PNG", "GIF"];

        if (imageExts.includes(file.ext)) {
          return `
            <div class="w-full h-full relative flex items-center justify-center bg-[#121316]">
              <img src="${url}" alt="${file.name}" loading="lazy"
                class="w-full h-full object-contain"
                onerror="this.style.display='none'; if (this.nextElementSibling) this.nextElementSibling.style.display='block';" />
              <div style="display:none" class="w-full h-full">${fallbackSVG}</div>
            </div>
          `;
        }

        if (file.ext === "MP4") {
          return `
            <div class="w-full h-full relative flex items-center justify-center bg-black">
              <video src="${url}" controls playsinline preload="metadata"
                class="w-full h-full object-contain"
                onerror="this.style.display='none'; if (this.nextElementSibling) this.nextElementSibling.style.display='block';"></video>
              <div style="display:none" class="w-full h-full">${fallbackSVG}</div>
            </div>
          `;
        }

        return `
          <div id="${slotId}" class="w-full h-full">
            ${fallbackSVG}
          </div>
        `;
      }

      /* ======================================================================
         6. SUBTLE ARCHITECTURAL TOAST
         ====================================================================== */
      let toastTimer = null;
      function showToast(message) {
        const toast = document.getElementById("os-toast");
        const textEl = document.getElementById("os-toast-text");
        if (!toast || !textEl) return;
        textEl.textContent = message;
        toast.classList.remove("opacity-0");
        toast.classList.add("opacity-100");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("opacity-100");
          toast.classList.add("opacity-0");
        }, 1800);
      }

      /* ======================================================================
         7. SELECTION, FOLDER-ONLY HISTORY & LIVE ARCHIVE SEARCH
         ====================================================================== */
      function selectNode(nodeId, pushHistory = true) {
        const node = NODE_MAP[nodeId];
        if (!node) return;
        state.selectedNodeId = nodeId;
        if (pushHistory) {
          const targetFolderId = node.type === "folder" ? node.id : (PARENT_MAP[node.id] || "root");
          const currentFolderAtIdx = state.folderHistory[state.folderHistoryIndex];
          if (currentFolderAtIdx !== targetFolderId) {
            state.folderHistory = state.folderHistory.slice(0, state.folderHistoryIndex + 1);
            state.folderHistory.push(targetFolderId);
            state.folderHistoryIndex = state.folderHistory.length - 1;
          }
        }
        renderFinder();
      }

      document.getElementById("btn-nav-back").addEventListener("click", () => {
        if (state.folderHistoryIndex > 0) {
          state.folderHistoryIndex -= 1;
          selectNode(state.folderHistory[state.folderHistoryIndex], false);
        }
      });

      document.getElementById("btn-nav-forward").addEventListener("click", () => {
        const selectedNode = NODE_MAP[state.selectedNodeId];
        if (!selectedNode || selectedNode.type !== "folder" || !selectedNode.children || selectedNode.children.length === 0) {
          return;
        }
        const nextFolderInHistory = state.folderHistory[state.folderHistoryIndex + 1];
        if (nextFolderInHistory && PARENT_MAP[nextFolderInHistory] === selectedNode.id) {
          state.folderHistoryIndex += 1;
          selectNode(nextFolderInHistory, false);
        } else {
          selectNode(selectedNode.children[0].id, true);
        }
      });

      function searchArchiveNodes(query) {
        const q = query.trim().toLowerCase();
        if (!q) return [];
        const terms = q.split(/\s+/).filter(Boolean);
        const matches = [];

        Object.values(NODE_MAP).forEach(node => {
          if (node.id === "root") return;
          const pathNames = (PATH_MAP[node.id] || [])
            .map(pid => NODE_MAP[pid]?.name || "")
            .join(" ");
          const haystack = `${node.name} ${node.ext || ""} ${node.kind || ""} ${node.material || ""} ${node.notes || ""} ${pathNames}`.toLowerCase();
          const allMatch = terms.every(t => haystack.includes(t));
          if (allMatch) {
            matches.push(node);
          }
        });

        matches.sort((a, b) => {
          const aExact = a.name.toLowerCase().includes(q) ? 0 : 1;
          const bExact = b.name.toLowerCase().includes(q) ? 0 : 1;
          if (aExact !== bExact) return aExact - bExact;
          if (a.type !== b.type) return a.type === "folder" ? -1 : 1;
          return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
        });

        return matches.slice(0, 120);
      }

        const qlBtn = document.getElementById("btn-inspector-quicklook");
        if (qlBtn && node.type === "file") {
          qlBtn.addEventListener("click", () => openQuickLook(node.id));

        if (node.type === "file") {
          probeRepoFile(node.relPath, (url) => {
            const rawLink = document.getElementById("btn-inspector-raw-link");

      /* ======================================================================
         9. RENDER FINDER (Top Toolbar, Recursive Miller Columns / List / Icons, Path Bar)

      function renderFinder() {
        const selectedPathIds = getSelectedPathIds();
        const selectedNode = NODE_MAP[state.selectedNodeId] || ARCHIVE_TREE;
        const currentFolder = getCurrentFolderNode();
        const isSearching = Boolean(state.searchQuery.trim());
        const searchResults = isSearching ? searchArchiveNodes(state.searchQuery) : [];

        // Back / Forward button states (Back = previous folder only; Forward = selected folder only)
        const canGoForward = Boolean(
          selectedNode &&
          selectedNode.type === "folder" &&
          Array.isArray(selectedNode.children) &&
          selectedNode.children.length > 0
        );
        document.getElementById("btn-nav-back").disabled = state.folderHistoryIndex <= 0;
        document.getElementById("btn-nav-forward").disabled = !canGoForward;

        // Top Toolbar Active Folder Title (Clean macOS Finder style)

        if (isSearching) {
          titleEl.textContent = `Searching “${state.searchQuery.trim()}”`;
        } else {
          titleEl.textContent = currentFolder.name || "reSEARCH";

        const crumbEl = document.getElementById("finder-breadcrumb");
        if (isSearching) {
          crumbEl.innerHTML = `

            <span class="text-white/35 text-[10px]">›</span>
            <span class="text-white/95 font-medium">Search Results (${searchResults.length})</span>

          crumbEl.innerHTML = selectedPathIds.map((id, idx) => {
            const node = NODE_MAP[id];
            const isLast = idx === selectedPathIds.length - 1;
            const sep = idx > 0 ? `<span class="text-white/35 text-[10px]">›</span>` : "";

        crumbEl.querySelectorAll("[data-crumb-id]").forEach(btn => {

            clearSearchFilter(false);
            selectNode(btn.getAttribute("data-crumb-id"));

        // --- SEARCH RESULTS VIEW ---

          const activeSearchNode = searchResults.find(n => n.id === state.selectedNodeId) || searchResults[0] || null;
          const rowsHTML = searchResults.length > 0 ? searchResults.map(node => {
            const isSel = activeSearchNode && activeSearchNode.id === node.id;

              .slice(0, -1)
              .map(pid => NODE_MAP[pid]?.name)
              .filter(Boolean)
              .join(" › ");
            return `

                class="w-full flex items-center justify-between gap-3 px-2.5 py-1.5 rounded-[7px] text-left transition-colors ${isSel ? "bg-[#0A60FF] text-white" : "text-white/90 hover:bg-white/[0.06]"}">

                    <div class="text-[10.5px] truncate ${isSel ? "text-white/80" : "text-white/40"}">${pathLabel}</div>
                  </div>
                </div>
                <span class="font-mono-tech text-[10px] shrink-0 ${isSel ? "text-white/85" : "text-white/40"}">
                  ${node.type === "folder" ? "Folder" : node.size}
                </span>
              </button>
            `;
          }).join("") : `
            <div class="p-8 text-center text-[12px] text-white/40">
              No folders or files match “${state.searchQuery}”.
            </div>
          `;

          container.innerHTML = `
            <div class="flex-1 flex min-w-0 overflow-hidden">
              <div class="w-full md:w-[440px] shrink-0 miller-col p-2 overflow-y-auto mac-scroll bg-[#1B1B1D] space-y-0.5">
                ${rowsHTML}
              </div>
              <div class="hidden md:flex flex-1 min-w-0 overflow-hidden">
                ${buildInspectorPaneHTML(activeSearchNode)}
              </div>
            </div>
          `;

          container.querySelectorAll("[data-search-node]").forEach(btn => {
            const id = btn.getAttribute("data-search-node");
            btn.addEventListener("click", () => {
              state.selectedNodeId = id;
              renderFinder();
            });
            btn.addEventListener("dblclick", () => {
              clearSearchFilter(false);
              selectNode(id);
            });
          });
          bindInspectorEvents(activeSearchNode);
          return;
        }

        // --- VIEW MODE 1: RECURSIVE MULTI-LEVEL MILLER COLUMNS ---
        if (state.viewMode === "columns") {
          const folderColumns = selectedPathIds
            .map(id => NODE_MAP[id])
            .filter(n => n && n.type === "folder");

          const columnsHTML = folderColumns.map((folderNode, colIdx) => {
            const children = folderNode.children || [];
            const nextSelectedId = selectedPathIds[colIdx + 1] || null;

            const itemsHTML = children.length > 0 ? children.map(item => {
              const isSelected = item.id === nextSelectedId;
              const isFolder = item.type === "folder";
              return `
                <button data-miller-node="${item.id}"
                  class="w-full flex items-center justify-between gap-2 px-2 py-[5px] rounded-[7px] text-left text-[12.5px] leading-tight transition-colors ${isSelected ? "bg-[#0A60FF] text-white font-medium" : "text-white/90 hover:bg-white/[0.06]"}">
                  <div class="flex items-center gap-2 min-w-0">
                    ${isFolder ? getMiniFolderSVG(isSelected, 16) : getFileIconSVG(item.ext, 16)}
                    <span class="truncate">${item.name}</span>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    ${isFolder
                      ? `<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="${isSelected ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.38)"}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polyline points="4.5 2.5 8 6 4.5 9.5"/></svg>`
                      : ""
                    }
                  </div>
                </button>
              `;
            }).join("") : `
              <div class="p-4 text-center text-[11px] text-white/35">Empty Folder</div>
            `;

            return `
              <div class="miller-col w-[210px] sm:w-[224px] shrink-0 px-2 pt-1.5 pb-6 overflow-y-auto mac-scroll bg-transparent space-y-[2px]">
                ${itemsHTML}
              </div>
            `;
          }).join("");

          container.innerHTML = `
            <div id="miller-columns-scroller" class="flex-1 flex min-w-0 overflow-x-auto overflow-y-hidden bg-transparent">
              ${columnsHTML}
              <!-- Rightmost Quick Look / Inspector Column -->
              <div class="min-w-[300px] flex-1 flex overflow-hidden bg-[#18181A]">
                ${buildInspectorPaneHTML(selectedNode)}
              </div>
            </div>
          `;

          container.querySelectorAll("[data-miller-node]").forEach(btn => {
            const nodeId = btn.getAttribute("data-miller-node");
            const node = NODE_MAP[nodeId];
            btn.addEventListener("click", () => {
              selectNode(nodeId);
              if (window.innerWidth < 640 && node && node.type === "file") {
                openQuickLook(nodeId);
              }
            });
            btn.addEventListener("dblclick", () => {
              if (node && node.type === "file") {
                openQuickLook(nodeId);
              }
            });
          });

          bindInspectorEvents(selectedNode);

          const scroller = document.getElementById("miller-columns-scroller");
          if (scroller && folderColumns.length > 2) {
            requestAnimationFrame(() => {
              scroller.scrollTo({ left: scroller.scrollWidth, behavior: "smooth" });
            });
          }

        // --- VIEW MODE 2: LIST VIEW (Name, Date Modified, Size, Kind) ---
        } else if (state.viewMode === "list") {
          const items = currentFolder.children || [];
          const activeItem = items.find(i => i.id === state.selectedNodeId) || items[0] || currentFolder;

          const rowsHTML = items.map(item => {
            const isSel = activeItem && activeItem.id === item.id;
            const isFolder = item.type === "folder";
            const sizeLabel = isFolder ? `${(item.children || []).length} items` : item.size;
            const kindLabel = isFolder ? "Folder" : item.kind;
            return `
              <tr data-list-node="${item.id}"
                class="border-b border-white/[0.045] cursor-default text-[12.5px] select-none ${isSel ? "bg-[#0A60FF] text-white" : "hover:bg-white/[0.05] text-white/90"}">
                <td class="py-1.5 px-3 flex items-center gap-2 font-medium truncate max-w-[240px]">
                  ${isFolder ? getMiniFolderSVG(isSel, 15) : getFileIconSVG(item.ext, 15)}
                  <span class="truncate">${item.name}</span>
                </td>
                <td class="py-1.5 px-2.5 font-mono-tech text-[11px] whitespace-nowrap ${isSel ? "text-white/85" : "text-white/45"}">${item.modified}</td>
                <td class="py-1.5 px-2.5 font-mono-tech text-[11px] whitespace-nowrap ${isSel ? "text-white/85" : "text-white/45"}">${sizeLabel}</td>
                <td class="py-1.5 px-3 text-[11.5px] hidden lg:table-cell truncate max-w-[170px] ${isSel ? "text-white/90" : "text-white/45"}">${kindLabel}</td>
              </tr>
            `;
          }).join("");

          container.innerHTML = `
            <div class="flex-1 flex min-w-0 overflow-hidden">
              <div class="flex-1 overflow-y-auto mac-scroll border-r border-white/[0.08]">
                <table class="w-full border-collapse text-left">
                  <thead class="sticky top-0 bg-[#202023] border-b border-white/[0.08] text-[11px] text-white/50">
                    <tr>
                      <th class="py-1.5 px-3 font-medium">Name</th>
                      <th class="py-1.5 px-2.5 font-medium">Date Modified</th>
                      <th class="py-1.5 px-2.5 font-medium">Size</th>
                      <th class="py-1.5 px-3 font-medium hidden lg:table-cell">Kind</th>
                    </tr>
                  </thead>
                  <tbody>${rowsHTML}</tbody>
                </table>
              </div>
              <div class="hidden md:flex w-[350px] shrink-0 overflow-hidden">
                ${buildInspectorPaneHTML(activeItem)}
              </div>
            </div>
          `;

          container.querySelectorAll("[data-list-node]").forEach(row => {
            const nodeId = row.getAttribute("data-list-node");
            const node = NODE_MAP[nodeId];
            row.addEventListener("click", () => {
              if (node.type === "file") {
                selectNode(nodeId);
              } else {
                state.selectedNodeId = nodeId;
                renderFinder();
              }
            });
            row.addEventListener("dblclick", () => {
              if (node.type === "folder") {
                selectNode(nodeId);
              } else {
                openQuickLook(nodeId);
              }
            });
          });
          bindInspectorEvents(activeItem);

        // --- VIEW MODE 3: ICON GRID VIEW ---
        } else {
          const items = currentFolder.children || [];
          const activeItem = items.find(i => i.id === state.selectedNodeId) || null;

          const cardsHTML = items.map(item => {
            const isSel = activeItem && activeItem.id === item.id;
            const isFolder = item.type === "folder";

            if (isFolder) {
              return `
                <div data-icon-node="${item.id}"
                  class="p-3.5 rounded-xl transition-all cursor-default flex flex-col items-center justify-center text-center select-none ${isSel ? "bg-[#0A60FF]/25 ring-1 ring-[#0A60FF]" : "hover:bg-white/[0.05]"}">
                  <div class="mb-2">${getMiniFolderSVG(isSel, 52)}</div>
                  <div class="text-[12px] font-medium px-2 py-0.5 rounded-[5px] truncate max-w-full ${isSel ? "bg-[#0A60FF] text-white" : "text-white/90"}">${item.name}</div>
                  <div class="text-[10.5px] text-white/40 mt-0.5">${(item.children || []).length} items</div>
                </div>
              `;
            }

            return `
              <div data-icon-node="${item.id}"
                class="p-2.5 rounded-xl border transition-all cursor-default flex flex-col select-none ${isSel ? "border-[#0A60FF] bg-[#0A60FF]/15 ring-1 ring-[#0A60FF]" : "border-white/[0.08] bg-[#222225] hover:border-white/20"}">
                <div class="w-full aspect-[16/10] rounded-lg border border-white/[0.08] overflow-hidden mb-2 bg-[#121316]">
                  ${buildAssetViewportHTML(item, false, `icon-slot-${item.id}`)}
                </div>
                <div class="flex items-center justify-between gap-1 font-mono-tech text-[10px] text-white/40">
                  <span>${item.ext}</span>
                  <span>${item.size}</span>
                </div>
                <div class="text-[12px] font-medium text-white/90 truncate mt-0.5">${item.name}</div>
              </div>
            `;
          }).join("");

          container.innerHTML = `
            <div class="flex-1 overflow-y-auto mac-scroll p-4 bg-[#19191B]">
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3.5">
                ${cardsHTML}
              </div>
            </div>
          `;

          container.querySelectorAll("[data-icon-node]").forEach(card => {
            const nodeId = card.getAttribute("data-icon-node");
            const node = NODE_MAP[nodeId];
            card.addEventListener("click", () => {
              if (node.type === "file") {
                selectNode(nodeId);
              } else {
                state.selectedNodeId = nodeId;
                renderFinder();
              }
            });
            card.addEventListener("dblclick", () => {
              if (node.type === "folder") {
                selectNode(nodeId);
              } else {
                openQuickLook(nodeId);
              }
            });
          });
        }
      }

      /* ======================================================================
         10. SPACEBAR / DOUBLE-CLICK QUICK LOOK MODAL
         ====================================================================== */
      const qlModal = document.getElementById("quicklook-modal");

      function openQuickLook(fileId) {
        const file = (NODE_MAP[fileId]?.type === "file" ? NODE_MAP[fileId] : null)
          || (NODE_MAP[state.selectedNodeId]?.type === "file" ? NODE_MAP[state.selectedNodeId] : null)
          || ALL_FILES[0];
        selectNode(file.id);
        renderQuickLookContent(file);
        qlModal.classList.remove("hidden");
        qlModal.classList.add("flex");
      }

      function closeQuickLook() {
        qlModal.classList.add("hidden");
        qlModal.classList.remove("flex");
      }

      function renderQuickLookContent(file) {
        document.getElementById("ql-window-title").textContent = `Quick Look — ${file.name}`;
        const body = document.getElementById("ql-window-body");
        const parentFolder = NODE_MAP[PARENT_MAP[file.id]];

        const sliderHTML = file.interactiveParam ? `
          <div class="px-4 py-2.5 bg-[#202023] border-t border-white/[0.08] flex items-center justify-between gap-4 shrink-0">
            <span class="font-mono-tech text-[11px] uppercase text-white/60">
              ${file.interactiveParam.label}:
              <strong id="ql-param-readout" class="text-[#4DA3FF]">${state.interactiveValues[file.id]}${file.interactiveParam.unit}</strong>
            </span>
            <input id="ql-param-slider" type="range"
              min="${file.interactiveParam.min}" max="${file.interactiveParam.max}" value="${state.interactiveValues[file.id]}"
              class="w-44 accent-[#0A60FF] cursor-pointer" />
          </div>
        ` : "";

        body.innerHTML = `
          <div class="flex-1 flex flex-col min-w-0 bg-[#121316] border-b md:border-b-0 md:border-r border-white/[0.08]">
            <div id="ql-svg-viewport" class="flex-1 p-4 flex items-center justify-center overflow-hidden">
              ${buildAssetViewportHTML(file, state.qlBlueprintInvert, "ql-media-slot")}
            </div>
            ${sliderHTML}
          </div>

          <div class="w-full md:w-[300px] shrink-0 p-4 overflow-y-auto mac-scroll bg-[#1A1A1C] flex flex-col justify-between">
            <div>
              <div class="flex items-center justify-between gap-2">
                <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-[#0A60FF]/20 border border-[#4DA3FF]/30 text-[#4DA3FF] font-mono-tech text-[11px] font-semibold">
                  <span>${file.iteration}</span>
                  <span>·</span>
                  <span>${file.ext}</span>
                  <span>·</span>
                  <span>${file.size}</span>
                </div>
                <a id="btn-ql-raw-link" href="${getRepoFileUrl(file.relPath)}" target="_blank" rel="noopener"
                  class="hidden liquid-pill px-2.5 py-0.5 rounded-full hover:bg-white/10 text-[10.5px] font-medium text-[#4DA3FF]">
                  Open Raw ↗
                </a>
              </div>
              <h2 class="text-[14.5px] font-bold text-white/95 mt-2.5 leading-snug break-all">${file.name}</h2>

              <div class="my-3.5 border-t border-white/[0.08] pt-3 space-y-2 text-[12px]">
                <div>
                  <div class="text-[10.5px] text-white/40">Location</div>
                  <div class="font-medium text-white/90">${parentFolder ? parentFolder.name : "reSEARCH"}</div>
                </div>
                <div>
                  <div class="text-[10.5px] text-white/40">Kind</div>
                  <div class="font-medium text-white/90">${file.kind}</div>
                </div>
                <div>
                  <div class="text-[10.5px] text-white/40">Created / Modified</div>
                  <div class="font-mono-tech text-[11px] text-white/85">${file.created} · ${file.modified}</div>
                </div>
                <div>
                  <div class="text-[10.5px] text-white/40">Dimensions</div>
                  <div class="font-mono-tech text-[11px] text-white/85">${file.dimensions}</div>
                </div>
                <div>
                  <div class="text-[10.5px] text-white/40">Material / Substrate</div>
                  <div class="text-white/85">${file.material}</div>
                </div>
              </div>

              <div class="border-t border-white/[0.08] pt-3">
                <div class="text-[10.5px] text-white/40 mb-1">Process Notes</div>
                <p class="text-[12.5px] leading-relaxed text-white/75 selectable-text">${file.notes}</p>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-white/[0.08] flex items-center justify-between font-mono-tech text-[10.5px] text-white/40">
              <span>File ${ALL_FILES.findIndex(x => x.id === file.id) + 1} of ${ALL_FILES.length}</span>
              <span>← / → Step · Esc Close</span>
            </div>
          </div>
        `;

        const qlSlider = document.getElementById("ql-param-slider");
        if (qlSlider) {
          qlSlider.addEventListener("input", (e) => {
            const val = Number(e.target.value);
            state.interactiveValues[file.id] = val;
            document.getElementById("ql-param-readout").textContent = `${val}${file.interactiveParam.unit}`;
            document.getElementById("ql-svg-viewport").innerHTML = buildAssetViewportHTML(file, state.qlBlueprintInvert, "ql-media-slot");
            renderFinder();
          });
        }

        probeRepoFile(file.relPath, (url) => {
          const rawLink = document.getElementById("btn-ql-raw-link");
          if (rawLink) rawLink.classList.remove("hidden");
          if (file.ext === "PDF") {
            const slot = document.getElementById("ql-media-slot");
            if (slot) {
              slot.innerHTML = `<iframe src="${url}" title="${file.name}" class="w-full h-full rounded-lg border-0 bg-white"></iframe>`;
            }
          }
        });
      }

      document.getElementById("btn-ql-close").addEventListener("click", closeQuickLook);
      qlModal.addEventListener("click", (e) => {
        if (e.target === qlModal) closeQuickLook();
      });

      document.getElementById("btn-ql-blueprint").addEventListener("click", () => {
        state.qlBlueprintInvert = !state.qlBlueprintInvert;
        const file = NODE_MAP[state.selectedNodeId]?.type === "file" ? NODE_MAP[state.selectedNodeId] : ALL_FILES[0];
        renderQuickLookContent(file);
      });

      function stepQuickLook(delta) {
        const idx = ALL_FILES.findIndex(f => f.id === state.selectedNodeId);
        const nextIdx = (idx + delta + ALL_FILES.length) % ALL_FILES.length;
        const nextFile = ALL_FILES[nextIdx];
        clearSearchFilter(false);
        selectNode(nextFile.id);
        renderQuickLookContent(nextFile);
      }

      document.getElementById("btn-ql-prev").addEventListener("click", () => stepQuickLook(-1));
      document.getElementById("btn-ql-next").addEventListener("click", () => stepQuickLook(1));

      /* ======================================================================
         11. TOOLBAR CONTROLS, LIVE SEARCH & KEYBOARD SHORTCUTS
         ====================================================================== */
      const searchInput = document.getElementById("finder-search-input");
      const clearSearchBtn = document.getElementById("btn-clear-search");

      function clearSearchFilter(rerender = true) {
        state.searchQuery = "";
        searchInput.value = "";
        clearSearchBtn.classList.add("hidden");
        clearSearchBtn.classList.remove("flex");
        if (rerender) renderFinder();
      }

      searchInput.addEventListener("input", (e) => {
        state.searchQuery = e.target.value;
        if (state.searchQuery.trim()) {
          clearSearchBtn.classList.remove("hidden");
          clearSearchBtn.classList.add("flex");
        } else {
          clearSearchBtn.classList.add("hidden");
          clearSearchBtn.classList.remove("flex");
        }
        renderFinder();
      });

      clearSearchBtn.addEventListener("click", () => clearSearchFilter(true));

      document.querySelectorAll(".view-mode-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const mode = btn.getAttribute("data-view-mode");
          state.viewMode = mode;
          document.querySelectorAll(".view-mode-btn").forEach(b => {
            const active = b.getAttribute("data-view-mode") === mode;
            b.classList.toggle("liquid-pill-active", active);
            b.classList.toggle("text-white", active);
            b.classList.toggle("text-white/60", !active);
            b.classList.toggle("border-transparent", !active);
          });
          renderFinder();
        });
      });

      document.getElementById("btn-traffic-close").addEventListener("click", () => {
        clearSearchFilter(false);
        selectNode("root");
        showToast("Returned to reSEARCH Root");
      });

      document.getElementById("btn-traffic-min").addEventListener("click", () => {
        closeQuickLook();
        clearSearchFilter(true);
        showToast("View Cleared");
      });

      document.getElementById("btn-traffic-max").addEventListener("click", () => {
        const win = document.getElementById("window-finder");
        const expanded = win.classList.toggle("expanded-window");
        showToast(expanded ? "Expanded Finder Viewport" : "Standard Finder Viewport");
      });

      window.addEventListener("keydown", (e) => {
        const isInputFocused = document.activeElement === searchInput;

        if ((e.metaKey || e.ctrlKey) && (e.key.toLowerCase() === "k" || e.key.toLowerCase() === "f")) {
          e.preventDefault();
          searchInput.focus();
          searchInput.select();
          return;
        }

        if (e.key === "Escape") {
          if (!qlModal.classList.contains("hidden")) {
            closeQuickLook();
            return;
          }
          if (state.searchQuery) {
            clearSearchFilter(true);
            searchInput.blur();
            return;
          }
        }

        if (isInputFocused) return;

        if (e.code === "Space") {
          e.preventDefault();
          if (qlModal.classList.contains("hidden")) {
            if (NODE_MAP[state.selectedNodeId]?.type === "file") {
              openQuickLook(state.selectedNodeId);
            }
          } else {
            closeQuickLook();
          }
          return;
        }

        const isQlOpen = !qlModal.classList.contains("hidden");
        if (isQlOpen) {
          if (e.key === "ArrowRight") stepQuickLook(1);
          if (e.key === "ArrowLeft") stepQuickLook(-1);
        } else {
          const parentId = PARENT_MAP[state.selectedNodeId];
          const siblings = parentId ? (NODE_MAP[parentId]?.children || []) : [];
          const idx = siblings.findIndex(s => s.id === state.selectedNodeId);
          if (e.key === "ArrowDown" && idx >= 0 && idx < siblings.length - 1) {
            e.preventDefault();
            selectNode(siblings[idx + 1].id);
          } else if (e.key === "ArrowUp" && idx > 0) {
            e.preventDefault();
            selectNode(siblings[idx - 1].id);
          } else if (e.key === "ArrowLeft" && parentId && parentId !== "root") {
            e.preventDefault();
            selectNode(parentId);
          } else if (e.key === "ArrowRight" && NODE_MAP[state.selectedNodeId]?.type === "folder") {
            const firstChild = NODE_MAP[state.selectedNodeId].children?.[0];
            if (firstChild) {
              e.preventDefault();
              selectNode(firstChild.id);
            }
          }
        }
      });

      /* ======================================================================
         12. INITIAL RENDER
         ====================================================================== */
      window.addEventListener("load", () => {
        renderFinder();
      });
    })();
  </script>
</body>
</html>
